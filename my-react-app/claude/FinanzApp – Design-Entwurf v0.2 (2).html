<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinanzApp – Design-Entwurf v0.2</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #f6f7f9;
      --sf: #fff;
      --tx: #0f172a;
      --mu: #64748b;
      --bd: #e8eaee;
      --ac: #4f46e5;
      --pos: #3d9a79;
      --neg: #d4647a;
      --sh: 0 1px 2px #0f172a0a, 0 4px 16px #0f172a08;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme=dunkel] {
      --bg: #0b0f17;
      --sf: #131a26;
      --tx: #e6ebf3;
      --mu: #8592a6;
      --bd: #212b3b;
      --ac: #818cf8;
      --pos: #6cc4a4;
      --neg: #e68c9a;
      --sh: none
    }

    :root[data-theme=ozean] {
      --bg: #f1f6f9;
      --tx: #0c2f3c;
      --mu: #58788a;
      --bd: #dbe7ee;
      --ac: #0e7490
    }

    :root[data-theme=wald] {
      --bg: #f2f5f1;
      --tx: #18291d;
      --mu: #64796b;
      --bd: #e0e8dc;
      --ac: #2f7d4f
    }

    :root[data-theme=sunset] {
      --bg: #fbf6f2;
      --tx: #33201a;
      --mu: #8a6f63;
      --bd: #f0e2d9;
      --ac: #e8590c
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased
    }

    button {
      font: inherit;
      color: inherit
    }

    svg {
      flex: none
    }

    .app {
      display: grid;
      grid-template-columns: 304px 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%
    }

    nav {
      background: var(--navbg, var(--sf));
      border-right: 1px solid var(--bd);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .logo {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      font-size: 17px;
      padding: 0 8px 22px;
      letter-spacing: -.02em
    }

    .logo i {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--ac), color-mix(in srgb, var(--ac) 55%, #000));
      display: grid;
      place-items: center;
      color: #fff;
      font-style: normal;
      font-weight: 700
    }

    .lab {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
      padding: 8px 12px 6px
    }

    .nb {
      all: unset;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--navtx, var(--mu));
      font-weight: 500;
      transition: .15s
    }

    .nb:hover {
      background: var(--bg);
      color: var(--tx)
    }

    .nb.on {
      background: color-mix(in srgb, var(--navac, var(--ac)) 11%, transparent);
      color: var(--navac, var(--ac));
      font-weight: 600
    }

    .nb.set {
      margin-top: 8px
    }

    .me {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 12px
    }

    .av {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ac) 16%, transparent);
      color: var(--ac);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 13px
    }

    .me b {
      display: block;
      font-size: 13px;
      line-height: 1.2
    }

    .me span {
      font-size: 12px;
      color: var(--mu)
    }

    .wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      border-bottom: 1px solid var(--bd);
      background: var(--sf)
    }

    .srch {
      flex: 0 1 340px;
      position: relative;
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--mu)
    }

    .srch span {
      font-size: 13px
    }

    .sp {
      flex: 1
    }

    .ib {
      all: unset;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      font-weight: 500;
      background: var(--sf);
      transition: .15s
    }

    .ib:hover {
      border-color: var(--ac);
      color: var(--ac)
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 28px 32px 48px
    }

    .in {
      max-width: 1180px;
      margin: 0 auto
    }

    .ph {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1.2
    }

    .sub {
      color: var(--mu);
      font-size: 13px
    }

    .btn {
      all: unset;
      cursor: pointer;
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--btn2, var(--sf));
      color: var(--btn2t, inherit);
      font-weight: 500;
      transition: .15s
    }

    .btn:hover {
      border-color: var(--ac)
    }

    .btn.pr {
      background: var(--btn, var(--ac));
      color: var(--btnt, #fff);
      border-color: var(--btn, var(--ac));
      box-shadow: 0 2px 8px color-mix(in srgb, var(--btn, var(--ac)) 35%, transparent)
    }

    .btn.pr:hover {
      filter: brightness(1.08)
    }

    .seg {
      display: inline-flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 20px
    }

    .seg button {
      all: unset;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: 500;
      color: var(--mu)
    }

    .seg button.on {
      background: var(--sf);
      color: var(--tx);
      box-shadow: var(--sh)
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--sh)
    }

    .card h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600
    }

    .chd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 16px;
      margin-bottom: 16px
    }

    .hero {
      background: linear-gradient(135deg, var(--hero1, var(--ac)), var(--hero2, color-mix(in srgb, var(--ac) 50%, #000)));
      color: #fff;
      border: 0;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px
    }

    .hero .sub {
      color: #ffffffb8
    }

    .hero .big {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 4px 0 8px
    }

    .hero svg.c {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 55%;
      height: 100%;
      opacity: .9
    }

    .bdg {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600
    }

    .bdg.p {
      background: color-mix(in srgb, var(--pos) 14%, transparent);
      color: var(--pos)
    }

    .hero .bdg.p {
      background: #ffffff26;
      color: #fff
    }

    .bdg.n {
      background: color-mix(in srgb, var(--neg) 12%, transparent);
      color: var(--neg)
    }

    .kpi .sub {
      display: flex;
      justify-content: space-between
    }

    .kpi b {
      display: block;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin: 6px 0 4px;
      font-variant-numeric: tabular-nums
    }

    .kpi .row2 {
      display: flex;
      justify-content: space-between;
      align-items: flex-end
    }

    .lg {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 9px 0;
      font-size: 13px
    }

    .lg i {
      width: 9px;
      height: 9px;
      border-radius: 3px
    }

    .lg span:last-child {
      margin-left: auto;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .tr {
      display: grid;
      grid-template-columns: 2.2fr 1.1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 8px;
      border-top: 1px solid var(--bd);
      cursor: pointer;
      border-radius: 10px;
      transition: .12s
    }

    .tr:hover {
      background: var(--bg)
    }

    .th {
      cursor: default;
      border: 0;
      font-size: 12px;
      color: var(--mu);
      font-weight: 600;
      padding-top: 0
    }

    .th:hover {
      background: none
    }

    .who {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0
    }

    .who b {
      display: block;
      font-weight: 600
    }

    .who span {
      font-size: 12px;
      color: var(--mu)
    }

    .ico {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      width: max-content
    }

    .amt {
      text-align: right;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .th .amt {
      font-weight: 600
    }

    .tb {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .tb .fi {
      flex: 1;
      min-width: 200px;
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 0 12px;
      background: var(--sf);
      color: var(--mu)
    }

    .fi input {
      all: unset;
      flex: 1;
      padding: 9px 0;
      color: var(--tx)
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      all: unset;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--sf);
      font-size: 13px;
      font-weight: 500;
      color: var(--mu)
    }

    .chip.on {
      background: var(--tx);
      color: var(--sf);
      border-color: var(--tx)
    }

    .dg {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 16px
    }

    .dl {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 0;
      margin: 0
    }

    .dl dt,
    .dl dd {
      padding: 11px 0;
      border-top: 1px solid var(--bd);
      margin: 0
    }

    .dl dt {
      color: var(--mu)
    }

    .dl dd {
      font-weight: 500;
      text-align: right
    }

    .pb {
      height: 8px;
      background: var(--bg);
      border-radius: 9px;
      overflow: hidden;
      margin: 6px 0
    }

    .pb i {
      display: block;
      height: 100%;
      background: var(--ac);
      border-radius: 9px
    }

    .scr {
      position: fixed;
      inset: 0;
      background: #0f172a55;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 8
    }

    .scr.open {
      opacity: 1;
      pointer-events: auto
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(340px, 100%);
      background: var(--sf);
      border-left: 1px solid var(--bd);
      padding: 24px;
      transform: translateX(105%);
      transition: .25s;
      z-index: 9;
      overflow: auto
    }

    .panel.open {
      transform: none
    }

    .sw {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      max-width: 640px;
      gap: 10px;
      margin: 10px 0 22px
    }

    .thm {
      all: unset;
      cursor: pointer;
      border: 2px solid var(--bd);
      border-radius: 12px;
      padding: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 500
    }

    .thm.on {
      border-color: var(--ac)
    }

    .thm i {
      display: flex;
      height: 34px;
      border-radius: 7px;
      margin-bottom: 5px;
      overflow: hidden
    }

    .thm i b {
      flex: 1
    }

    .pal {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 24px;
      align-items: center
    }

    .dot {
      all: unset;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid var(--sf);
      box-shadow: 0 0 0 1px var(--bd)
    }

    .dot.on {
      box-shadow: 0 0 0 2px var(--tx)
    }

    input[type=color] {
      width: 100%;
      height: 44px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--sf);
      padding: 3px;
      cursor: pointer
    }

    .scl {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0 -8px;
      padding: 0 8px
    }

    nav {
      overflow: hidden
    }

    .gh {
      font-weight: 600
    }

    .gh>span:nth-child(2) {
      flex: 1
    }

    .gh.ac {
      color: var(--tx)
    }

    .chv {
      display: grid;
      transition: .2s;
      color: var(--mu)
    }

    .chv.o {
      transform: rotate(180deg)
    }

    .sl {
      display: flex;
      flex-direction: column;
      margin: 2px 0 6px 21px;
      padding-left: 12px;
      border-left: 1px solid var(--bd)
    }

    .nb.s {
      display: block;
      padding: 7px 10px;
      font-size: 13px;
      line-height: 1.35
    }

    .gt {
      display: none
    }

    .top {
      grid-column: 1/-1;
      background: var(--navbg, var(--sf))
    }

    .top .logo {
      padding: 0;
      margin-right: 8px
    }

    main {
      min-height: 0
    }

    .wrap {
      min-height: 0
    }

    .app.nosb {
      grid-template-columns: 1fr
    }

    .app.nosb #nav {
      display: none
    }

    .tn {
      display: flex;
      gap: 2px;
      min-width: 0;
      overflow: hidden
    }

    .sx {
      all: unset;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--navtx, var(--mu));
      font-weight: 500;
      font-size: 13.5px;
      white-space: nowrap;
      transition: .15s;
      flex: 0 1 auto;
      min-width: 0
    }

    .sx span {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sx .sh {
      display: none
    }

    @media(max-width:1240px) {
      .sx .tl {
        display: none
      }

      .sx .sh {
        display: inline
      }
    }

    .sx:hover {
      background: var(--bg);
      color: var(--tx)
    }

    .sx.on {
      background: color-mix(in srgb, var(--navac, var(--ac)) 11%, transparent);
      color: var(--navac, var(--ac));
      font-weight: 600
    }

    .lab2 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
      padding: 0 12px 10px
    }

    .bc {
      margin-bottom: 14px
    }

    .bc:empty {
      display: none
    }

    .top {
      position: relative
    }

    .bc {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--mu);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden
    }

    .bc b {
      color: var(--tx);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bc button {
      all: unset;
      cursor: pointer
    }

    .bc button:hover {
      color: var(--ac)
    }

    .srch input {
      all: unset;
      flex: 1;
      color: var(--tx);
      font-size: 13px;
      min-width: 0
    }

    .srch kbd {
      font: 11px ui-monospace, monospace;
      border: 1px solid var(--bd);
      border-radius: 5px;
      padding: 0 5px;
      color: var(--mu)
    }

    .sr {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 12px;
      box-shadow: 0 12px 30px #0002;
      padding: 6px;
      display: none;
      z-index: 15;
      max-height: 340px;
      overflow: auto
    }

    .sr.on {
      display: block
    }

    .sr button {
      all: unset;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--tx)
    }

    .sr button:hover,
    .sr button.hv {
      background: var(--bg)
    }

    .sr small {
      color: var(--mu);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sr .em {
      padding: 10px;
      color: var(--mu);
      font-size: 13px
    }

    .nt {
      position: relative
    }

    .bell {
      position: relative
    }

    .bd {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--neg);
      color: #fff;
      border-radius: 99px;
      font-size: 10px;
      min-width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-style: normal;
      padding: 0 4px
    }

    .np {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(340px, 92vw);
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 14px;
      box-shadow: 0 12px 30px #0002;
      padding: 8px;
      display: none;
      z-index: 15
    }

    .np.on {
      display: block
    }

    .nh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px 8px;
      font-weight: 600
    }

    .ni {
      all: unset;
      display: block;
      cursor: pointer;
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box
    }

    .ni:hover {
      background: var(--bg)
    }

    .ni.un::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ac);
      margin-right: 8px
    }

    .ni small {
      display: block;
      color: var(--mu);
      margin-left: 15px
    }

    .pvr {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 4px 0 8px
    }

    .seg.sm {
      padding: 2px;
      border-radius: 8px
    }

    .seg.sm button {
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 6px
    }

    .chd {
      flex-wrap: wrap;
      gap: 8px
    }

    .kpi .sub {
      flex-wrap: wrap;
      gap: 8px
    }

    .hero .seg {
      background: #ffffff26
    }

    .hero .seg button {
      color: #ffffffd0
    }

    .hero .seg button.on {
      background: #fff;
      color: #1e1b4b;
      box-shadow: none
    }

    .kpi b .pos {
      color: var(--pos)
    }

    .kpi b .neg {
      color: var(--neg)
    }

    .btn:active {
      transform: scale(.97)
    }

    .or {
      border-radius: 8px;
      transition: background .3s
    }

    .or.fl {
      background: color-mix(in srgb, var(--ac) 16%, transparent)
    }

    .og {
      display: grid;
